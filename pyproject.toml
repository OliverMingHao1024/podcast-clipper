[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-clipper"
version = "0.1.0"
description = "Cut audio podcasts into clips and a tighter episode, with local Whisper and any AI command-line tool you are logged in to (claude, codex, custom)."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
speakers = ["sherpa-onnx>=2.0", "numpy"]
gpu = ["faster-whisper>=1.0", "nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
dev = ["pytest"]

[project.scripts]
podclip = "podclip.cli:main"

[tool.setuptools.packages.find]
include = ["podclip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
